<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fish to Go</title>
<meta name="theme-color" content="#f7f0dc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fish to Go">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--ink:#4b3a2a;--muted:#9a8770;--bg:#f7f0dc;--card:#fffcf2;--line:#ecdfbf;--orange:#ef7f45;--teal:#5fa8a8;--green:#8db255}
body{font-family:'Fredoka',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;user-select:none;-webkit-user-select:none;
  background-image:radial-gradient(circle at 15% 10%,rgba(246,211,196,.45) 0 60px,transparent 61px),radial-gradient(circle at 90% 40%,rgba(191,224,220,.4) 0 80px,transparent 81px),radial-gradient(circle at 20% 85%,rgba(220,232,170,.4) 0 70px,transparent 71px);background-attachment:fixed}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:92px}
header{position:sticky;top:0;z-index:10;background:rgba(255,252,242,.96);backdrop-filter:blur(6px);border-bottom:1.5px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:12px}
.lvl{width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f9b27a,#ef7f45);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:19px;box-shadow:0 3px 0 #c9622e,inset 0 2px 0 rgba(255,255,255,.35);flex:none;line-height:1}
.lvl small{font-size:9px;font-weight:600;margin-bottom:1px;opacity:.9}
.lvl.bump{animation:bump .6s}
@keyframes bump{50%{transform:scale(1.3) rotate(-6deg)}}
.xpwrap{flex:1;min-width:0}
.xptext{font-size:12px;color:var(--muted);margin-bottom:5px;display:flex;justify-content:space-between;gap:6px}
.xptext span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbar{height:11px;background:#efe4c8;border-radius:8px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(120,90,40,.15)}
.xpfill{height:100%;width:0;background:linear-gradient(90deg,#f6c06b,#ef7f45);border-radius:8px;transition:width .4s}
.coins{background:#fff1d0;border:1.5px solid #f1dca5;padding:6px 11px;border-radius:20px;font-weight:600;white-space:nowrap;color:#8a5a1c}
main{padding:14px}
.view{display:none}.view.active{display:block}
h2{font-size:17px;margin:6px 2px 10px;font-weight:600}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:12px;margin-bottom:12px;box-shadow:0 3px 0 rgba(200,175,120,.18)}

/* art */
.art{display:block;width:100%;height:100%;overflow:visible}
.sil .art{filter:brightness(0);opacity:.16}

/* scene */
.scene{position:relative;aspect-ratio:400/230;border-radius:24px;overflow:hidden;border:1.5px solid var(--line);box-shadow:0 4px 0 rgba(200,175,120,.2)}
.scenesvg{position:absolute;inset:0;width:100%;height:100%}
.locname{position:absolute;top:10px;left:10px;background:rgba(255,252,242,.88);padding:4px 11px;border-radius:12px;font-weight:600;font-size:14px;z-index:3;border:1.5px solid var(--line)}
.scenesvg .bob{animation:bob 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(2px) rotate(4deg)}}
.scene.bite .bob{animation:dip .65s ease-in}
@keyframes dip{0%{transform:translateY(0)}25%{transform:translateY(7px)}50%{transform:translateY(2px)}100%{transform:translateY(12px)}}
.scenesvg .rip{transform-box:fill-box;transform-origin:center;animation:rip 2.6s ease-out infinite;opacity:0}
.scenesvg .rip2{animation-delay:1.3s}
@keyframes rip{0%{transform:scale(.4);opacity:.7}100%{transform:scale(2.6);opacity:0}}
.scenesvg .sway{transform-box:fill-box;transform-origin:bottom center;animation:sway 5s ease-in-out infinite}
.scenesvg .sway2{animation-duration:6.5s;animation-direction:reverse}
@keyframes sway{50%{transform:rotate(2.5deg)}}
.popfish{position:absolute;left:50%;top:40%;width:84px;height:66px;opacity:0;z-index:4;transform:translate(-50%,0);pointer-events:none}
.popfish.jump{animation:jump 1.2s ease-out}
@keyframes jump{0%{opacity:0;transform:translate(-50%,30px) scale(.4)}35%{opacity:1;transform:translate(-50%,-58px) rotate(-14deg) scale(1.15)}75%{opacity:1;transform:translate(-50%,-52px) rotate(8deg) scale(1.05)}100%{opacity:0;transform:translate(-50%,-66px) scale(.9)}}
.shake{animation:shake .5s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

.cast{position:relative;overflow:hidden;width:100%;margin:14px 0 12px;padding:17px;font:inherit;font-size:23px;font-weight:700;color:#fff;background:linear-gradient(#f6a36a,#ef7f45);border:none;border-radius:22px;box-shadow:0 5px 0 #c9622e,inset 0 2px 0 rgba(255,255,255,.3);touch-action:manipulation;cursor:pointer;letter-spacing:.3px}
.cast:active{transform:translateY(3px);box-shadow:0 2px 0 #c9622e}
.cast.cooling{filter:saturate(.35) brightness(.97)}
.castfill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.3)}
.cast span{position:relative}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:6px 11px;font-size:13px;font-family:inherit;color:var(--ink);cursor:pointer}

.ci{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:16px;border:2px solid var(--rc);background:#fff;background:color-mix(in srgb,var(--rc) 13%,#fffcf2);margin-bottom:6px}
.ci:last-child{margin-bottom:0}
.ci.r-l{box-shadow:0 0 16px rgba(242,185,75,.6)}
.ci .pic{width:58px;height:46px;flex:none}
.ct{flex:1;display:flex;flex-direction:column;min-width:0}
.ct small{color:var(--muted);font-size:12px}
.new{display:inline-block;margin-left:6px;background:#ef7f9a;color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;vertical-align:middle;font-weight:600}
.xp{font-weight:600;color:#5c8f8f;font-size:13px;white-space:nowrap}
.pop{animation:pop .35s}
@keyframes pop{from{transform:scale(.95);opacity:.3}}
.hint{color:var(--muted);text-align:center;padding:10px 4px;font-size:15px}

.bbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.btn{font:inherit;font-weight:600;border:none;border-radius:14px;padding:8px 14px;background:var(--teal);color:#fff;touch-action:manipulation;cursor:pointer;white-space:nowrap;box-shadow:0 3px 0 #437e7e}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #437e7e}
.btn:disabled{background:#dcd2bb;box-shadow:0 3px 0 #c2b69b;cursor:default}
.btn.gold{background:#f2b04b;box-shadow:0 3px 0 #c98a2a}
.btn.ghost{background:#f3ead3;color:var(--ink);box-shadow:0 3px 0 #ddd0ae}
.btn.danger{background:#e07a6e;box-shadow:0 3px 0 #b55a50}
.row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1.5px dashed var(--line)}
.row:last-child{border:none}
.row .em{font-size:30px;width:52px;text-align:center;flex:none}
.row .pic{width:56px;height:44px;flex:none}
.row .info{flex:1;min-width:0}
.row .info small{display:block;color:var(--muted);font-size:12px}
.row .acts{display:flex;flex-direction:column;gap:7px;align-items:flex-end}
.tag{font-size:12px;padding:5px 10px;border-radius:10px;background:#f3ead3;color:var(--muted);white-space:nowrap}
.tag.on{background:#e3efcc;color:#5e8a2e}
.log{display:flex;flex-wrap:wrap;gap:2px}
.log .pic{width:40px;height:32px}
.empty{text-align:center;color:var(--muted);padding:26px 8px}
.empty .em{font-size:44px;display:block;margin-bottom:6px}

.loc{border-radius:20px;margin-bottom:14px;position:relative;overflow:hidden;border:1.5px solid var(--line);background:var(--card);box-shadow:0 3px 0 rgba(200,175,120,.18)}
.loc .thumb{position:relative;aspect-ratio:400/150;overflow:hidden}
.loc .thumb svg{position:absolute;left:0;top:-30%;width:100%;height:auto}
.loc.locked .thumb{filter:grayscale(.8) brightness(1.05);opacity:.7}
.loc .body{padding:10px 14px 14px}
.loc h3{font-size:18px;font-weight:600}
.loc p{font-size:13px;margin:2px 0 6px;color:var(--muted)}
.loc .meta{font-size:12px;margin-bottom:10px;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{border-radius:16px;padding:6px 4px 8px;text-align:center;background:#fff;border:2px solid var(--rc);background:color-mix(in srgb,var(--rc) 10%,#fffcf2)}
.cell .pic{width:100%;height:52px}
.cell b{display:block;font-size:12px;line-height:1.2;margin-top:2px;font-weight:600}
.cell small{font-size:11px;color:var(--muted)}
.cell.unk{border-color:var(--line);background:#fbf6e8}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#f8f1de;border-radius:14px;padding:10px}
.stat small{color:var(--muted);font-size:12px;display:block}
.stat b{font-size:16px;font-weight:600}

nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(255,252,242,.97);border-top:1.5px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;border:none;background:none;font:inherit;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11px;position:relative;cursor:pointer}
nav button .e{font-size:22px;filter:saturate(.7)}
nav button.active{color:var(--orange);font-weight:600}
nav button.active .e{filter:none;transform:scale(1.1)}
.nb{position:absolute;top:3px;left:calc(50% + 6px);background:#ef7f9a;color:#fff;font-size:10px;border-radius:8px;padding:0 5px;min-width:16px;line-height:16px;font-weight:600}
.nb:empty{display:none}

#toasts{position:fixed;top:82px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:90%;max-width:420px}
.toast{background:rgba(75,58,42,.94);color:#fff;padding:10px 14px;border-radius:16px;font-size:14px;animation:tin .3s,tout .4s 2.4s forwards;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.toast.gold{background:linear-gradient(135deg,#f2b04b,#ef7f45);font-weight:600}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
@keyframes tout{to{opacity:0;transform:translateY(-6px)}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="paint" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="sh" x1="0" y1="0" x2="0" y2="1"><stop offset=".45" stop-color="#3a1f00" stop-opacity="0"/><stop offset="1" stop-color="#3a1f00" stop-opacity=".16"/></linearGradient>
  </defs>
</svg>

<div id="app">
  <header>
    <div class="lvl" id="lvl"><small>LVL</small><span id="lvlNum">1</span></div>
    <div class="xpwrap">
      <div class="xptext"><span id="xpText">0 / 20 xp</span><span id="locShort"></span></div>
      <div class="xpbar"><div class="xpfill" id="xpFill"></div></div>
    </div>
    <div class="coins">💰 <span id="coins">0</span></div>
  </header>

  <main>
    <section class="view active" id="v-vis">
      <div class="scene" id="scene">
        <div id="sceneArt"></div>
        <div class="locname" id="locName"></div>
        <div class="popfish" id="popFish"></div>
      </div>
      <button class="cast" id="castBtn"><div class="castfill" id="castFill"></div><span>🎣 Vissen!</span></button>
      <div class="chips">
        <button class="chip" onclick="show('winkel')" id="rodChip"></button>
        <button class="chip" onclick="show('winkel')" id="baitChip"></button>
      </div>
      <div class="card" id="catchCard"><div class="hint"><b style="font-size:20px;color:#ef7f45">Welkom bij Fish to Go! 🐟</b><br>Tik op <b>Vissen!</b> om je hengel uit te werpen 🎣</div></div>
      <div class="card bbar" id="bucketBar"></div>
      <div class="card" id="logCard" style="display:none">
        <h2 style="margin:0 0 6px;font-size:14px;color:var(--muted)">Laatste vangsten</h2>
        <div class="log" id="log"></div>
      </div>
    </section>
    <section class="view" id="v-emmer"></section>
    <section class="view" id="v-winkel"></section>
    <section class="view" id="v-plekken"></section>
    <section class="view" id="v-visboek"></section>
  </main>

  <nav>
    <button data-v="vis" class="active"><span class="e">🎣</span>Vissen</button>
    <button data-v="emmer"><span class="e">🪣</span>Emmer<span class="nb" id="nbEmmer"></span></button>
    <button data-v="winkel"><span class="e">🛒</span>Winkel</button>
    <button data-v="plekken"><span class="e">🗺️</span>Plekken</button>
    <button data-v="visboek"><span class="e">📖</span>Visboek</button>
  </nav>
</div>
<div id="toasts"></div>

<script>
/* =========================================================
   KLEUR-HULP
   ========================================================= */
function shade(hex,amt){
  const c=hex.replace('#','');let r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
  const t=amt<0?0:255,p=Math.abs(amt);
  r=Math.round(r+(t-r)*p);g=Math.round(g+(t-g)*p);b=Math.round(b+(t-b)*p);
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function rng(seed){let h=7;for(const ch of seed)h=(h*31+ch.charCodeAt(0))|0;h=Math.abs(h)||1;return()=>{h=(h*16807)%2147483647;return h/2147483647;};}

/* =========================================================
   TEKENINGEN (SVG, geschilderde stijl)
   ========================================================= */
const F=n=>Math.round(n*10)/10;
function eye(x,y,r,glow){
  if(glow)return `<circle cx="${F(x)}" cy="${F(y)}" r="${r+3.5}" fill="#ffe46b" opacity=".3"/><circle cx="${F(x)}" cy="${F(y)}" r="${r}" fill="#ffe46b" stroke="#c9952a" stroke-width="1"/><circle cx="${F(x)}" cy="${F(y)}" r="${r*.4}" fill="#3a2a1e"/>`;
  return `<circle cx="${F(x)}" cy="${F(y)}" r="${r}" fill="#2e2018"/><circle cx="${F(x-r*.3)}" cy="${F(y-r*.35)}" r="${F(r*.36)}" fill="#fff"/>`;
}
const blush=(x,y)=>`<ellipse cx="${F(x)}" cy="${F(y)}" rx="3.8" ry="2.1" fill="#ff8a8a" opacity=".38"/>`;
function sparkles(){return [[0,8,4.5],[96,4,3.6],[100,72,3.2]].map(([x,y,r])=>`<path d="M${x} ${y-r*2}Q${x} ${y} ${x+r*2} ${y}Q${x} ${y} ${x} ${y+r*2}Q${x} ${y} ${x-r*2} ${y}Q${x} ${y} ${x} ${y-r*2}Z" fill="#fff6b0" stroke="#e8be45" stroke-width=".9"/>`).join('');}
function starShape(x,y,r,fill){return `<path d="M${x} ${y-r}Q${x} ${y} ${x+r} ${y}Q${x} ${y} ${x} ${y+r}Q${x} ${y} ${x-r} ${y}Q${x} ${y} ${x} ${y-r}Z" fill="${fill}"/>`;}

function artFish(p){
  const SH={round:[42,40,24,20],tall:[42,40,23,24],long:[38,40,30,14],slim:[40,40,28,12]};
  const shape=p.shape||'round';const [cx,cy,rx,ry]=SH[shape];
  const c1=p.c1,c2=p.c2||shade(c1,.65),fin=p.fin||shade(c1,.3),ol=shade(c1,-.42),fo=shade(fin,-.35),tc=p.tailc||fin,tco=shade(tc,-.35);
  const tx=cx+rx-5;let s='';
  // staart
  const T=p.tail||'fork';
  if(T==='fan'){
    s+=`<path d="M${tx} ${cy}C${tx+12} ${cy-32} ${tx+36} ${cy-30} ${tx+32} ${cy-8}C${tx+29} ${cy} ${tx+36} ${cy+6} ${tx+31} ${cy+18}C${tx+26} ${cy+32} ${tx+8} ${cy+28} ${tx} ${cy}Z" fill="${tc}" stroke="${tco}" stroke-width="1.6" stroke-linejoin="round"/>`;
    s+=[[26,-22],[31,-10],[31,6],[25,20],[18,-14],[18,14]].map(([dx,dy])=>`<path d="M${tx+3} ${cy}L${tx+dx} ${cy+dy}" stroke="${tco}" stroke-width="1" opacity=".45"/>`).join('');
  }else if(T==='round'){
    s+=`<path d="M${tx} ${cy}C${tx+8} ${cy-20} ${tx+26} ${cy-18} ${tx+25} ${cy}C${tx+26} ${cy+18} ${tx+8} ${cy+20} ${tx} ${cy}Z" fill="${tc}" stroke="${tco}" stroke-width="1.6"/>`;
    s+=[[20,-10],[23,0],[20,10]].map(([dx,dy])=>`<path d="M${tx+3} ${cy}L${tx+dx} ${cy+dy}" stroke="${tco}" stroke-width="1" opacity=".45"/>`).join('');
  }else{
    s+=`<path d="M${tx} ${cy}C${tx+8} ${cy-6} ${tx+18} ${cy-18} ${tx+28} ${cy-21}C${tx+22} ${cy-8} ${tx+22} ${cy+8} ${tx+28} ${cy+21}C${tx+18} ${cy+18} ${tx+8} ${cy+6} ${tx} ${cy}Z" fill="${tc}" stroke="${tco}" stroke-width="1.6" stroke-linejoin="round"/>`;
    s+=[[20,-12],[20,12]].map(([dx,dy])=>`<path d="M${tx+3} ${cy}L${tx+dx} ${cy+dy}" stroke="${tco}" stroke-width="1" opacity=".45"/>`).join('');
  }
  // rugvin
  const D=p.dorsal||'soft';
  if(D==='tri')s+=`<path d="M${cx-9} ${cy-ry+3}C${cx-3} ${cy-ry-8} ${cx+1} ${cy-ry-17} ${cx+3} ${cy-ry-20}C${cx+6} ${cy-ry-10} ${cx+10} ${cy-ry-2} ${cx+15} ${cy-ry+3}Z" fill="${shade(c1,-.08)}" stroke="${ol}" stroke-width="1.5" stroke-linejoin="round"/>`;
  else{const h=D==='big'?19:11;s+=`<path d="M${F(cx-rx*.35)} ${cy-ry+4}C${F(cx-rx*.2)} ${cy-ry-h} ${F(cx+rx*.45)} ${cy-ry-h+2} ${F(cx+rx*.72)} ${F(cy-ry*.55)}Z" fill="${fin}" stroke="${fo}" stroke-width="1.4" stroke-linejoin="round"/>`;
    s+=`<path d="M${F(cx)} ${cy-ry+2}L${F(cx+rx*.1)} ${cy-ry-h*.6}M${F(cx+rx*.3)} ${cy-ry+3}L${F(cx+rx*.35)} ${cy-ry-h*.45}" stroke="${fo}" stroke-width="1" opacity=".45"/>`;}
  // buikvin
  s+=`<path d="M${F(cx+rx*.35)} ${F(cy+ry*.8)}C${F(cx+rx*.45)} ${cy+ry+8} ${F(cx+rx*.75)} ${cy+ry+6} ${F(cx+rx*.82)} ${F(cy+ry*.45)}Z" fill="${fin}" stroke="${fo}" stroke-width="1.3"/>`;
  if(p.sword)s+=`<path d="M${cx-rx+5} ${cy-3}L${cx-rx-24} ${cy+.5}L${cx-rx+5} ${cy+3.5}Z" fill="${shade(c1,.3)}" stroke="${ol}" stroke-width="1.3" stroke-linejoin="round"/>`;
  // lijf
  s+=`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${c1}" stroke="${ol}" stroke-width="1.8"/>`;
  s+=`<ellipse cx="${F(cx-rx*.15)}" cy="${F(cy+ry*.42)}" rx="${F(rx*.74)}" ry="${F(ry*.48)}" fill="${c2}" opacity=".9"/>`;
  if(p.face)s+=`<ellipse cx="${F(cx-rx*.66)}" cy="${cy+1}" rx="${F(rx*.33)}" ry="${F(ry*.7)}" fill="${c2}"/>`;
  // patroon
  const R=rng(p.id||'x');
  if(p.pat==='spots'||p.pat==='glow'){
    const n=p.n||8;let k=0,tries=0;
    while(k<n&&tries<200){tries++;const u=R()*2-1,v=R()*2-1;if(u*u+v*v>.6||u<-.42)continue;
      const x=cx+u*rx,y=cy+v*ry,r=(1.1+R()*1.7)*(p.sr||1);
      if(p.pat==='glow')s+=`<circle cx="${F(x)}" cy="${F(y)}" r="${F(r+2.5)}" fill="${p.pc}" opacity=".3"/>`;
      s+=`<circle cx="${F(x)}" cy="${F(y)}" r="${F(r)}" fill="${p.pc||shade(c1,-.25)}" opacity=".85"/>`;k++;}
  }else if(p.pat==='stripes'){
    (p.sx||[-.28,.12,.5]).forEach(dx=>{const h=ry*Math.sqrt(1-dx*dx)*.93;s+=`<ellipse cx="${F(cx+dx*rx)}" cy="${cy}" rx="3.4" ry="${F(h)}" fill="${p.pc}" ${p.pco?`stroke="${p.pco}" stroke-width="1.2"`:''} opacity=".92"/>`;});
  }else if(p.pat==='scales'){

const KEY='pocketvisser_v2';
function fresh(){return {coins:0,lvl:1,xp:0,loc:'vijver',rod:0,boats:[],bait:{},activeBait:null,bucket:{},dex:{},stats:{casts:0,caught:0,earned:0,best:null},log:[]};}
let S=fresh();
try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);S=Object.assign(fresh(),d);S.stats=Object.assign(fresh().stats,d.stats||{});
  for(const k of Object.keys(S.bucket))if(!FISH[k])delete S.bucket[k];S.log=S.log.filter(k=>FISH[k]);if(!LOCS.find(l=>l.id===S.loc))S.loc='vijver';}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

const $=s=>document.querySelector(s);
const fmt=n=>Math.floor(n).toLocaleString('nl-NL');
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const locById=id=>LOCS.find(l=>l.id===id);
const xpNeed=l=>Math.floor(20*Math.pow(l,1.8));
function vibrate(ms){try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}}
function toast(msg,cls){const t=document.createElement('div');t.className='toast '+(cls||'');t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),2900);}
const bucketCount=()=>Object.values(S.bucket).reduce((a,b)=>a+b,0);
const bucketValue=()=>Object.entries(S.bucket).reduce((a,[id,n])=>a+FISH[id].v*n,0);
const canGo=L=>S.lvl>=L.lvl&&(!L.boat||S.boats.includes(L.boat));
function pickRarity(luck){
  const w={c:60,u:25*(1+luck*.5),r:10*(1+luck),e:4*(1+luck*1.4),l:1*(1+luck*1.8)};
  let tot=0;for(const k in w)tot+=w[k];let x=Math.random()*tot;
  for(const k of RORDER){x-=w[k];if(x<=0)return k;}return 'c';
}

let busy=false;
$('#castBtn').addEventListener('click',cast);
function cast(){
  if(busy)return;busy=true;
  const rod=RODS[S.rod],btn=$('#castBtn'),fill=$('#castFill');
  btn.classList.add('cooling');
  fill.style.transition='none';fill.style.width='0%';void fill.offsetWidth;
  fill.style.transition=`width ${rod.cd}s linear`;fill.style.width='100%';
  const sc=$('#scene');sc.classList.remove('bite');void sc.offsetWidth;sc.classList.add('bite');
  vibrate(12);
  setTimeout(()=>{sc.classList.remove('bite');doCatch();},650);
  setTimeout(()=>{busy=false;btn.classList.remove('cooling');fill.style.transition='none';fill.style.width='0%';},rod.cd*1000);
}
function doCatch(){
  const rod=RODS[S.rod],L=locById(S.loc);
  let luck=rod.luck;
  if(S.activeBait&&(S.bait[S.activeBait]||0)>0){
    const b=BAITS.find(x=>x.id===S.activeBait);luck+=b.luck;S.bait[S.activeBait]--;
    if(S.bait[S.activeBait]<=0){S.activeBait=null;toast(`${b.em} Je ${b.name.toLowerCase()} is op!`);}
  }
  S.stats.casts++;
  const n=rint(rod.min,rod.max),caught=[];
  for(let i=0;i<n;i++){
    let f;
    if(Math.random()<.12/(1+luck))f=pick(TRASH_F);
    else{const r=pickRarity(luck);f=pick(L.fish.filter(x=>x.r===r));}
    const isNew=!f.trash&&!S.dex[f.id];
    S.dex[f.id]=(S.dex[f.id]||0)+1;S.bucket[f.id]=(S.bucket[f.id]||0)+1;S.stats.caught++;
    if(!f.trash&&(!S.stats.best||f.v>FISH[S.stats.best].v))S.stats.best=f.id;
    caught.push({f,isNew});
  }
  let chest=0;
  if(Math.random()<.03){chest=Math.round(15*Math.pow(2,L.idx)*(1+S.lvl/10));S.coins+=chest;S.stats.earned+=chest;}
  S.log=[...caught.map(c=>c.f.id),...S.log].slice(0,16);
  showCatch(caught,chest);
  addXp(caught.reduce((a,c)=>a+c.f.xp,0));
  save();renderAll();
}
function showCatch(caught,chest){
  caught.sort((a,b)=>b.f.v-a.f.v);const best=caught[0].f;
  let h=caught.map(c=>`<div class="ci r-${c.f.r}" style="--rc:${RAR[c.f.r].col}">${pic(c.f.id)}<div class="ct"><b>${c.f.name}${c.isNew?'<span class="new">NIEUW</span>':''}</b><small>${RAR[c.f.r].n} · 💰${fmt(c.f.v)}</small></div><span class="xp">+${fmt(c.f.xp)} xp</span></div>`).join('');
  if(chest)h+=`<div class="ci" style="--rc:#f2b04b"><div class="pic" style="font-size:34px;text-align:center;line-height:46px">🎁</div><div class="ct"><b>Schatkist!</b><small>Direct in je portemonnee</small></div><span class="xp" style="color:#c27c00">+💰${fmt(chest)}</span></div>`;
  const card=$('#catchCard');card.innerHTML=h;card.classList.remove('pop');void card.offsetWidth;card.classList.add('pop');
  const pf=$('#popFish');pf.innerHTML=art(best.id);pf.classList.remove('jump');void pf.offsetWidth;pf.classList.add('jump');
  if(best.r==='l'){toast(`🌟 LEGENDARISCH! ${best.name}!`,'gold');shake();vibrate([40,40,80]);}
  else if(best.r==='e'){toast(`💜 Episch! ${best.name}`);vibrate(30);}
  else if(chest)toast(`🎁 Schatkist gevonden! +💰${fmt(chest)}`,'gold');
}
function shake(){const sc=$('#scene');sc.classList.remove('shake');void sc.offsetWidth;sc.classList.add('shake');}
function addXp(x){
  if(S.lvl>=MAX_LVL)return;
  S.xp+=x;let up=false;
  while(S.lvl<MAX_LVL&&S.xp>=xpNeed(S.lvl)){
    S.xp-=xpNeed(S.lvl);S.lvl++;up=true;
    toast(S.lvl>=MAX_LVL?'🏆 MAX LEVEL 100! Je bent een vislegende!':`⭐ Level ${S.lvl}!`,'gold');
    LOCS.filter(l=>l.lvl===S.lvl).forEach(l=>toast(`${l.emoji} Nieuwe plek: ${l.name}${l.boat&&!S.boats.includes(l.boat)?' (boot nodig)':''}`));
  }
  if(S.lvl>=MAX_LVL)S.xp=0;
  if(up){const b=$('#lvl');b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump');vibrate([20,30,20]);}
}

/* =========================================================
   ACTIES
   ========================================================= */
function sellAll(){const v=bucketValue();if(!v)return;S.coins+=v;S.stats.earned+=v;S.bucket={};save();toast(`💰 +${fmt(v)} munten`);renderAll();}
function sellOne(id){const n=S.bucket[id];if(!n)return;const v=FISH[id].v*n;S.coins+=v;S.stats.earned+=v;delete S.bucket[id];save();toast(`💰 +${fmt(v)} munten`);renderAll();}
function buyRod(i){const r=RODS[i];if(i<=S.rod||S.coins<r.price)return;S.coins-=r.price;S.rod=i;save();toast(`🎣 ${r.name} gekocht!`,'gold');renderAll();}
function buyBoat(id){const b=BOATS.find(x=>x.id===id);if(S.boats.includes(id)||S.coins<b.price)return;S.coins-=b.price;S.boats.push(id);save();toast(`${b.em} ${b.name} gekocht!`,'gold');renderAll();}
function buyBait(id){const b=BAITS.find(x=>x.id===id);if(S.coins<b.price)return;S.coins-=b.price;S.bait[id]=(S.bait[id]||0)+PACK;if(!S.activeBait)S.activeBait=id;save();toast(`${b.em} ${PACK}× ${b.name.toLowerCase()} gekocht`);renderAll();}
function useBait(id){S.activeBait=S.activeBait===id?null:id;save();renderAll();}
function travel(id){const L=locById(id);if(!canGo(L))return;S.loc=id;save();renderAll();show('vis');toast(`${L.emoji} Welkom bij ${L.name}!`);}
let resetArmed=false;
function resetGame(btn){
  if(!resetArmed){resetArmed=true;btn.textContent='Zeker weten? Tik nog eens';setTimeout(()=>{resetArmed=false;renderDex();},3000);return;}
  try{localStorage.removeItem(KEY);}catch(e){}
  S=fresh();resetArmed=false;$('#catchCard').innerHTML='<div class="hint"><b style="font-size:20px;color:#ef7f45">Welkom bij Fish to Go! 🐟</b><br>Tik op <b>Vissen!</b> om je hengel uit te werpen 🎣</div>';
  renderAll();show('vis');toast('🔄 Nieuw begin!');
}

/* =========================================================
   WEERGAVE
   ========================================================= */
let sceneLoc=null;
function renderHeader(){
  const max=S.lvl>=MAX_LVL,need=xpNeed(S.lvl);
  $('#lvlNum').textContent=S.lvl;
  $('#xpText').textContent=max?'MAX LEVEL 🏆':`${fmt(S.xp)} / ${fmt(need)} xp`;
  $('#xpFill').style.width=(max?100:Math.min(100,S.xp/need*100))+'%';
  $('#coins').textContent=fmt(S.coins);
  const L=locById(S.loc);$('#locShort').textContent=L.emoji+' '+L.name;
  const c=bucketCount();$('#nbEmmer').textContent=c?(c>99?'99+':c):'';
}
function setScene(){
  if(sceneLoc===S.loc)return;sceneLoc=S.loc;
  const L=locById(S.loc);$('#sceneArt').innerHTML=sceneSVG(L);$('#locName').textContent=L.emoji+' '+L.name;
}
function renderFishView(){
  $('#rodChip').textContent=`🎣 ${RODS[S.rod].name}`;
  const b=S.activeBait&&BAITS.find(x=>x.id===S.activeBait);
  $('#baitChip').textContent=b?`${b.em} ${b.name} (${S.bait[b.id]||0})`:'🪝 Geen aas';
  const c=bucketCount(),v=bucketValue();
  $('#bucketBar').innerHTML=`<div>🪣 <b>${c}</b> in je emmer<br><small style="color:var(--muted)">Waarde: 💰${fmt(v)}</small></div><button class="btn gold" onclick="sellAll()" ${v?'':'disabled'}>Verkoop alles</button>`;
  $('#logCard').style.display=S.log.length?'block':'none';
  $('#log').innerHTML=S.log.map(id=>pic(id)).join('');
}
function renderBucket(){
  const ent=Object.entries(S.bucket).sort((a,b)=>FISH[b[0]].v*b[1]-FISH[a[0]].v*a[1]);
  let h=`<h2>🪣 Je emmer</h2>`;
  if(!ent.length)h+=`<div class="card empty"><span class="em">🪣</span>Je emmer is leeg.<br>Ga vissen!</div>`;
  else{
    h+=`<div class="card bbar"><div><b>${bucketCount()}</b> vangsten<br><small style="color:var(--muted)">Totaal: 💰${fmt(bucketValue())}</small></div><button class="btn gold" onclick="sellAll()">Verkoop alles</button></div><div class="card">`;
    h+=ent.map(([id,n])=>{const f=FISH[id];return `<div class="row">${pic(id)}<div class="info"><b>${f.name}</b> ×${n}<small style="color:${shade(RAR[f.r].col,-.2)}">${RAR[f.r].n} · 💰${fmt(f.v)} per stuk</small></div><button class="btn ghost" onclick="sellOne('${id}')">💰${fmt(f.v*n)}</button></div>`;}).join('')+`</div>`;
  }
  $('#v-emmer').innerHTML=h;
}
function renderShop(){
  let h=`<h2>🎣 Hengels</h2><div class="card">`;
  h+=RODS.map((r,i)=>{
    const act=i===S.rod?'<span class="tag on">In gebruik</span>':i<S.rod?'<span class="tag">Gekocht</span>':`<button class="btn" onclick="buyRod(${i})" ${S.coins<r.price?'disabled':''}>💰${fmt(r.price)}</button>`;
    return `<div class="row"><span class="em">🎣</span><div class="info"><b>${r.name}</b><small>${r.min===r.max?r.min:r.min+'–'+r.max} vis per worp · geluk +${Math.round(r.luck*100)}% · ${r.cd.toFixed(1).replace('.',',')}s</small></div>${act}</div>`;
  }).join('')+`</div>`;
  h+=`<h2>⛵ Boten</h2><div class="card">`;
  h+=BOATS.map(b=>{const L=LOCS.find(l=>l.boat===b.id);
    const act=S.boats.includes(b.id)?'<span class="tag on">In bezit</span>':`<button class="btn" onclick="buyBoat('${b.id}')" ${S.coins<b.price?'disabled':''}>💰${fmt(b.price)}</button>`;
    return `<div class="row"><span class="em">${b.em}</span><div class="info"><b>${b.name}</b><small>Nodig voor ${L.emoji} ${L.name} (level ${L.lvl})</small></div>${act}</div>`;}).join('')+`</div>`;
  h+=`<h2>🪱 Aas</h2><div class="card">`;
  h+=BAITS.map(b=>{const have=S.bait[b.id]||0,on=S.activeBait===b.id;
    return `<div class="row"><span class="em">${b.em}</span><div class="info"><b>${b.name}</b><small>Geluk +${Math.round(b.luck*100)}% per worp · je hebt ${have}</small></div><div class="acts"><button class="btn" onclick="buyBait('${b.id}')" ${S.coins<b.price?'disabled':''}>${PACK}× 💰${fmt(b.price)}</button>${have?`<button class="btn ghost" onclick="useBait('${b.id}')">${on?'✓ Actief':'Gebruik'}</button>`:''}</div></div>`;}).join('')+`</div><p style="font-size:12px;color:var(--muted);padding:0 4px 8px">Geluk geeft meer kans op zeldzame vissen en minder rommel. Aas gaat 1 per worp op.</p>`;
  $('#v-winkel').innerHTML=h;
}
const THUMBS={};
function renderLocs(){
  let h=`<h2>🗺️ Visplekken</h2>`;
  h+=LOCS.map(L=>{
    const here=S.loc===L.id,ok=canGo(L),found=L.fish.filter(f=>S.dex[f.id]).length,bt=L.boat&&BOATS.find(b=>b.id===L.boat);
    let act;
    if(here)act='<span class="tag on">📍 Je bent hier</span>';
    else if(S.lvl<L.lvl)act=`<span class="tag">🔒 Level ${L.lvl}</span>`;
    else if(L.boat&&!S.boats.includes(L.boat))act=`<button class="btn ghost" onclick="show('winkel')">🔒 ${bt.em} ${bt.name} nodig</button>`;
    else act=`<button class="btn" onclick="travel('${L.id}')">Hierheen ➜</button>`;
    const th=THUMBS[L.id]||(THUMBS[L.id]=sceneSVG(L,true).replace('class="scenesvg"','').replace('preserveAspectRatio="xMidYMid slice"',''));
    return `<div class="loc ${ok?'':'locked'}"><div class="thumb">${th}</div><div class="body"><h3>${L.emoji} ${L.name}</h3><p>${L.desc}</p><div class="meta">Level ${L.lvl}+${bt?' · '+bt.em+' '+bt.name:''} · 📖 ${found}/${L.fish.length} ontdekt</div>${act}</div></div>`;
  }).join('');
  $('#v-plekken').innerHTML=h;
}
function renderDex(){
  const total=LOCS.reduce((a,L)=>a+L.fish.length,0),found=LOCS.reduce((a,L)=>a+L.fish.filter(f=>S.dex[f.id]).length,0);
  const best=S.stats.best&&FISH[S.stats.best];
  let h=`<h2>📖 Visboek · ${found}/${total}</h2>`;
  h+=LOCS.map(L=>`<div class="card"><b>${L.emoji} ${L.name}</b><div class="grid" style="margin-top:8px">${L.fish.map(f=>S.dex[f.id]?`<div class="cell" style="--rc:${RAR[f.r].col}">${pic(f.id)}<b>${f.name}</b><small>${RAR[f.r].n} · ×${S.dex[f.id]}</small></div>`:`<div class="cell unk">${pic(f.id,'sil')}<b>???</b><small>${RAR[f.r].n}</small></div>`).join('')}</div></div>`).join('');
  h+=`<h2>📊 Statistieken</h2><div class="card"><div class="stats">
    <div class="stat"><small>Worpen</small><b>${fmt(S.stats.casts)}</b></div>
    <div class="stat"><small>Gevangen</small><b>${fmt(S.stats.caught)}</b></div>
    <div class="stat"><small>Totaal verdiend</small><b>💰${fmt(S.stats.earned)}</b></div>
    <div class="stat"><small>Beste vangst</small><b>${best?best.name:'–'}</b></div>
  </div></div>
  <div style="text-align:center;padding:6px 0 10px"><button class="btn danger" onclick="resetGame(this)">${resetArmed?'Zeker weten? Tik nog eens':'Opnieuw beginnen'}</button></div>`;
  $('#v-visboek').innerHTML=h;
}
function renderAll(){renderHeader();setScene();renderFishView();renderBucket();renderShop();renderLocs();renderDex();}
function show(v){
  document.querySelectorAll('.view').forEach(e=>e.classList.toggle('active',e.id==='v-'+v));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));
  window.scrollTo(0,0);
}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.v)));
renderAll();
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
</script>
</body>
</html>
